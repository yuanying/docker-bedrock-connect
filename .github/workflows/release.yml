name: Weekly release

on:
  schedule:
    # Mondays at 09:00 JST
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    # A release is cut from the default branch only, also when run by hand.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.next.outputs.release }}
      version: ${{ steps.next.outputs.version }}
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Only the files the image is built from count. Changes to workflows
      # or renovate.json alone do not change the image and release nothing.
      - id: next
        run: .github/scripts/next-release.sh Dockerfile custom_servers.json

  publish:
    needs: check
    if: needs.check.outputs.release == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker.yml
    with:
      version: ${{ needs.check.outputs.version }}

  # The tag is pushed only after its image is, so a tag never names an
  # image that does not exist. Should this job fail, the next run publishes
  # the same version again and retries the tag.
  tag:
    needs: [check, publish]
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - env:
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
