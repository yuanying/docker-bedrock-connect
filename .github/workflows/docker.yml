name: Publish Docker image

on:
  push:
    branches:
      - 'main'
      - 'v*'
    tags:
      - 'v*'
    paths:
      - '.github/workflows/docker.yml'
      - 'Dockerfile'
      - 'custom_servers.json'
  pull_request:
    paths:
      - '.github/workflows/docker.yml'
      - 'Dockerfile'
      - 'custom_servers.json'
  # The weekly release (release.yml) calls this to publish the version it is
  # about to tag. A tag pushed with GITHUB_TOKEN starts no workflow, so the
  # image is pushed here, in the release's own run.
  workflow_call:
    inputs:
      version:
        description: 'Version to publish, as X.Y.Z'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      -
        name: Prepare
        id: prep
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          DOCKER_IMAGE=ghcr.io/${{ github.repository }}
          VERSION=latest
          SHORTREF=${GITHUB_SHA::8}
          PUSH=false
          # If this is git tag, use the tag name as a docker tag
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
            PUSH=true
          fi
          # Called by the weekly release, which names the version itself
          if [[ -n $INPUT_VERSION ]]; then
            VERSION=$INPUT_VERSION
            PUSH=true
          fi
          TAGS="${DOCKER_IMAGE}:${VERSION},${DOCKER_IMAGE}:${SHORTREF}"
          # If the VERSION looks like a version number, assume that
          # this is the most recent version of the image and also
          # tag it 'latest'.
          if [[ $VERSION =~ ^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]]; then
            TAGS="$TAGS,${DOCKER_IMAGE}:latest"
          fi
          # Set output parameters.
          {
            echo "tags=${TAGS}"
            echo "docker_image=${DOCKER_IMAGE}"
            echo "push=${PUSH}"
          } >> "$GITHUB_OUTPUT"
      -
        # https://github.com/actions/checkout
        name: Checkout
        uses: actions/checkout@v7
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      -
        name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
      -
        name: Docker Login
        if: steps.prep.outputs.push == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Docker Buildx
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.prep.outputs.push == 'true' }}
          tags: ${{ steps.prep.outputs.tags }}
